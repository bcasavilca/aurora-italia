<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff2e63' d='M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.6 5 6 5c2 0 3.4 1.1 4.2 2.3h3.6C14.6 6.1 16 5 18 5c3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<title>Nuova password — Aurora</title>
<style>html{background:#14060d}</style>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tema-2-vibrante.css">
<link rel="stylesheet" href="tema-2-tw.css">
</head>
<body>
<main class="wrap form-pag">
  <h1>Nuova password</h1>
  <form id="f">
    <label>Nuova password<input id="pw" type="password" minlength="8" required></label>
    <label>Conferma<input id="pw2" type="password" minlength="8" required></label>
    <button>Reimposta</button>
  </form>
  <p id="msg"></p>
  <p class="links"><a href="login.html">Torna al login</a></p>
</main>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  if (!token) msg.textContent = 'Link non valido.';
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('/api/reset', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: pw.value, confirm: pw2.value }) });
    const d = await r.json();
    msg.textContent = d.ok ? 'Password cambiata! Vai al login.' : (d.error || 'Errore');
    if (d.ok) setTimeout(() => location.href = 'login.html', 1500);
  };
</script>
<script src="menu.js"></script>
</body>
</html>
