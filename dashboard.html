<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff2e63' d='M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.6 5 6 5c2 0 3.4 1.1 4.2 2.3h3.6C14.6 6.1 16 5 18 5c3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<title>I miei annunci — Aurora</title>
<style>html{background:#14060d}</style>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tema-2-vibrante.css">
<link rel="stylesheet" href="tema-2-tw.css">
</head>
<body>
<header class="topo">
  <div class="wrap topo-in">
    <a class="logo" href="index.html">Aurora</a>
    <nav class="menu">
      <button class="ham" id="ham" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="drop" id="drop" hidden>
        <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Esplora</span></a>
        <a href="publicar.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Pubblica annuncio</span></a>
        <a href="chat.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Messaggi</span><span class="msg-badge" hidden></span></a>
        <a href="dashboard.html" class="ativo" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-6M12 20V8M18 20v-10"/></svg><span>Dashboard</span></a>
        <span class="email" hidden></span>
        <a href="login.html" class="btn">Accedi</a>
        <a href="registrar.html" class="btn sec" hidden>Crea account</a>
        <button class="btn link-btn" id="esci" hidden>Esci</button>
      </div>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="busca dash-top">
    <h1>I miei annunci</h1>
    <p id="stato">Caricamento...</p>
    <p class="dash-acao"><a class="btn" href="publicar.html">+ Nuovo annuncio</a></p>
  </section>
  <section>
    <div class="grade" id="grade"></div>
  </section>
  <section id="modsec" hidden>
    <h2>Recensioni da approvare</h2>
    <div id="modlist"></div>
  </section>
</main>
<script src="menu.js"></script>
<script>
  (async () => {
    const grade = document.getElementById('grade');
    const stato = document.getElementById('stato');
    let user = null;
    try {
      const r = await fetch('/api/me', { credentials: 'same-origin' });
      user = (await r.json()).user;
    } catch {}
    if (!user) { stato.innerHTML = 'Devi <a href="login.html">accedere</a> per vedere i tuoi annunci.'; return; }
    let tutti = [];
    try { tutti = await (await fetch('/api/anunci')).json(); } catch {}
    const miei = tutti.filter(a => a.email === user.email);
    stato.textContent = `${miei.length} ${miei.length === 1 ? 'annuncio' : 'annunci'}`;
    let stats = {};
    try { stats = await (await fetch('/api/stats', { credentials: 'same-origin' })).json(); } catch {}
    if (!miei.length) { grade.innerHTML = '<p>Nessun annuncio. Pubblica il primo!</p>'; return; }
    miei.forEach(a => {
      const el = document.createElement('article');
      el.className = 'card';
      const ev = a.destaqueAte && a.destaqueAte > new Date().toISOString();
      const st = stats[a.id] || { visite: 0, contatti: 0 };
      el.innerHTML = `
        <a href="anuncio.html?id=${a.id}"><div class="foto">${a.foto ? `<img src="${a.foto}" alt="">` : '<span>Nessuna foto</span>'}</div></a>
        <div class="card-corpo">
          ${ev ? `<span class="eta">⭐ In evidenza fino al ${a.destaqueAte.slice(0, 10).split('-').reverse().join('/')}</span>` : ''}
          ${a.verificata ? `<span class="verificata">✔ Verificata</span>` : ''}
          <h3><a href="anuncio.html?id=${a.id}">${a.titolo}</a></h3>
          <p class="citta">${a.citta} · ${a.prezzo} €</p>
          <p class="stat">👁 ${st.visite} visite · ✉️ ${st.contatti} contatti</p>
          <a class="btn sec" href="editar.html?id=${a.id}">Modifica</a>
          <button class="btn" data-del="${a.id}">Elimina</button>
          <button class="btn sec" data-ver="${a.id}" data-state="${a.verificata ? 1 : 0}">${a.verificata ? '✓ Verificata' : 'Verifica'}</button>
        </div>`;
      grade.appendChild(el);
    });
    grade.onclick = async (e) => {      const b = e.target.closest('[data-del]');
      if (b) {
        if (!confirm('Eliminare questo annuncio?')) return;
        await fetch('/api/anunci/' + b.dataset.del, { method: 'DELETE', credentials: 'same-origin' });
        location.reload();
        return;
      }
      const v = e.target.closest('[data-ver]');
      if (v) {
        const r = await fetch('/api/anunci/' + v.dataset.ver, { method: 'PUT', headers: {'Content-Type':'application/json'},
          credentials: 'same-origin', body: JSON.stringify({ verificata: v.dataset.state === '1' ? 0 : 1 }) });
        if (!r.ok) { alert('Errore'); return; }
        location.reload();
      }
    };
    // Moderação de recensioni
    try {
      const pend = await (await fetch('/api/commenti/pending', { credentials: 'same-origin' })).json();
      if (Array.isArray(pend) && pend.length) {
        document.getElementById('modsec').hidden = false;
        const ml = document.getElementById('modlist');
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        ml.innerHTML = pend.map((c) => `<div class="rec"><strong>${esc(c.nome)}</strong> <span class="citta">su ${esc(c.anuncioTitolo)}</span><p>${esc(c.testo)}</p><button class="btn sec" data-mod="ok" data-id="${c.id}">Approva</button> <button class="btn" data-mod="no" data-id="${c.id}">Scarta</button></div>`).join('');
        ml.onclick = async (e) => {
          const b = e.target.closest('[data-mod]');
          if (!b) return;
          await fetch('/api/commenti/' + b.dataset.id + '/moderar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin', body: JSON.stringify({ azione: b.dataset.mod }) });
          location.reload();
        };
      }
    } catch {}
  })();
</script>
</body>
</html>
