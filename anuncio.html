<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff2e63' d='M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.6 5 6 5c2 0 3.4 1.1 4.2 2.3h3.6C14.6 6.1 16 5 18 5c3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<title>Annuncio — Aurora</title>
<style>html{background:#14060d}</style>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tema-2-vibrante.css">
<link rel="stylesheet" href="tema-2-tw.css">
</head>
<body>
<header class="topo">
  <div class="wrap topo-in">
    <a class="logo" href="index.html">Aurora</a>
    <nav class="menu">
      <button class="ham" id="ham" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="drop" id="drop" hidden>
        <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Esplora</span></a>
        <a href="publicar.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Pubblica annuncio</span></a>
        <a href="chat.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Messaggi</span><span class="msg-badge" hidden></span></a>
        <a href="dashboard.html" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-6M12 20V8M18 20v-10"/></svg><span>Dashboard</span></a>
        <span class="email" hidden></span>
        <a href="login.html" class="btn">Accedi</a>
        <a href="registrar.html" class="btn sec" hidden>Crea account</a>
        <button class="btn link-btn" id="esci" hidden>Esci</button>
      </div>
    </nav>
  </div>
</header>
<main class="wrap detalhe">
  <a href="index.html">← Torna agli annunci</a>
  <h1 id="titolo">Annuncio</h1>
  <div class="foto-grande" id="foto">Nessuna foto</div>
  <div class="gal" id="gal"></div>
  <p id="info"></p>
  <p id="desc">Descrizione di esempio. Qui andranno foto, prezzo e pulsante contatta.</p>
  <a class="btn grande" id="contatta" href="chat.html">Contatta</a>
  <button class="btn sec grande" id="favBtn">♡ Salva nei preferiti</button>
  <p class="links"><a id="segnala" href="segnala.html">Segnala questo annuncio</a></p>
</main>
<script src="dados.js"></script>
<script>
  (async () => {
    const id = new URLSearchParams(location.search).get('id') || 1;
    let a = ANUNCI.find(x => x.id == id) || ANUNCI[0];
    try {
      const r = await fetch('/api/anunci');
      const d = await r.json();
      if (Array.isArray(d)) { const f = d.find(x => String(x.id) === String(id)); if (f) a = f; }
    } catch {}
    document.getElementById('titolo').textContent = a.titolo;
    document.getElementById('info').innerHTML = `${a.citta} · ${a.prezzo} €${a.verificata ? ' <span class="verificata">✔ Verificata</span>' : ''}`;
    const favBtn = document.getElementById('favBtn');
    const getFav = () => { try { return JSON.parse(localStorage.getItem('auroraFav') || '[]').map(String); } catch { return []; } };
    const marcaFav = () => {
      const on = getFav().includes(String(a.id));
      favBtn.textContent = on ? '♥ Nei preferiti' : '♡ Salva nei preferiti';
    };
    marcaFav();
    favBtn.onclick = () => {
      let favs = getFav();
      const id = String(a.id);
      favs = favs.includes(id) ? favs.filter((x) => x !== id) : [...favs, id];
      localStorage.setItem('auroraFav', JSON.stringify(favs));
      marcaFav();
    };
    if (a.descrizione) document.getElementById('desc').textContent = a.descrizione;
    const lista = (a.fotos && a.fotos.length ? a.fotos : [a.foto].filter(Boolean));
    const fotoEl = document.getElementById('foto');
    const galEl = document.getElementById('gal');
    if (lista.length) {
      fotoEl.innerHTML = `<img id="foto-main" src="${lista[0]}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`;
      galEl.innerHTML = lista.map((x, i) => `<img src="${x}" data-i="${i}" class="${i === 0 ? 'sel' : ''}" alt="">`).join('');
      galEl.onclick = (e) => {
        const im = e.target.closest('img');
        if (!im) return;
        document.getElementById('foto-main').src = lista[+im.dataset.i];
        galEl.querySelectorAll('img').forEach(y => y.classList.remove('sel'));
        im.classList.add('sel');
      };
    }
    document.getElementById('contatta').href = 'chat.html?anuncio=' + encodeURIComponent(a.id);
    document.getElementById('segnala').href = 'segnala.html?annuncio=' + encodeURIComponent(a.titolo + ' — ' + a.citta);
  })();
</script>
<script src="menu.js"></script>
</body>
</html>
