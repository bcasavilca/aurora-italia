<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff2e63' d='M12 21s-7.5-4.9-9.7-9.2C.7 8.6 2.6 5 6 5c2 0 3.4 1.1 4.2 2.3h3.6C14.6 6.1 16 5 18 5c3.4 0 5.3 3.6 3.7 6.8C19.5 16.1 12 21 12 21z'/></svg>">
<title>Segnala — Aurora</title>
<style>html{background:#14060d}</style>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="tema-2-vibrante.css">
<link rel="stylesheet" href="tema-2-tw.css">
</head>
<body>
<header class="topo">
  <div class="wrap topo-in">
    <a class="logo" href="index.html">Aurora</a>
    <nav class="menu">
      <button class="ham" id="ham" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="drop" id="drop" hidden>
        <a href="index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Esplora</span></a>
        <a href="publicar.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Pubblica annuncio</span></a>
        <a href="chat.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Messaggi</span><span class="msg-badge" hidden></span></a>
        <a href="dashboard.html" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-6M12 20V8M18 20v-10"/></svg><span>Dashboard</span></a>
        <span class="email" hidden></span>
        <a href="login.html" class="btn">Accedi</a>
        <a href="registrar.html" class="btn sec" hidden>Crea account</a>
        <button class="btn link-btn" id="esci" hidden>Esci</button>
      </div>
    </nav>
  </div>
</header>
<main class="wrap form-pag">
  <h1>Segnala un problema</h1>
  <p>Truffa, furto di foto, minore, comportamento sospetto? Raccontaci, interveniamo.</p>
  <form id="f">
    <label>Annuncio (link o titolo)<input id="annuncio" placeholder="Es. Dona matura — Bergamo"></label>
    <label>Motivo
      <select id="motivo">
        <option>Truffa / richiesta anticipo</option>
        <option>Foto false o rubate</option>
        <option>Minore sospetto</option>
        <option>Spam o comportamento scorretto</option>
        <option>Privacy / rimozione dati</option>
        <option>Altro</option>
      </select>
    </label>
    <label>Dettagli<textarea id="dettagli" rows="4" required maxlength="2000" placeholder="Cosa è successo?"></textarea></label>
    <label>Tua email (facoltativa)<input id="email" type="email" placeholder="per ricontattarti"></label>
    <button id="btn" type="submit">Invia segnalazione</button>
  </form>
  <p id="msg"></p>
  <script>
    const qsA = new URLSearchParams(location.search).get('annuncio');
    if (qsA) document.getElementById('annuncio').value = qsA;
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; msg.textContent = 'Invio...';
      try {
        const r = await fetch('/api/segnalazioni', { method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ anuncio: annuncio.value, motivo: motivo.value, dettagli: dettagli.value, email: email.value }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Errore');
        msg.textContent = 'Grazie! Segnalazione ricevuta, la esamineremo.';
        document.getElementById('f').hidden = true;
      } catch (err) { msg.textContent = err.message; btn.disabled = false; }
    };
  </script>
  <p class="links"><a href="index.html">Torna agli annunci</a></p>
</main>
<script src="menu.js"></script>
</body>
</html>
